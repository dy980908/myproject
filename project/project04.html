<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="프로젝트 상세 페이지"
  />

  <title>프로젝트 상세 페이지</title>

  <!-- 공용 스타일 -->
  <link
    rel="stylesheet"
    href="../css/style.css"
  />

  <!-- 프로젝트 상세페이지 전용 스타일 -->
  <link
    rel="stylesheet"
    href="../css/project.css"
  />
</head>

<body
  data-page="archive" data-root="../" data-project-page>
<main class="project-detail">

  <section id="project-top" class="project-layout">

    <!-- 왼쪽 고정 설명 영역 -->
    <aside class="project-info">
      <div class="project-info__sticky">

        <p class="project-eyebrow">
         BRANDING / CONTENT DESIGN · 2026
        </p>

        <h1 class="project-title">
          브랜딩블로그
        </h1>

        <p class="project-intro">
          브랜드의 아이덴티티를 반영한 블로그 환경을 구축하고, 콘텐츠 전달력을 높이기 위한 카드뉴스와 스킨 디자인을 진행한 프로젝트입니다.
        </p>

        <dl class="project-meta">
          <div>
            <dt>ROLE</dt>
            <dd>
            Blog Skin Design, Card News Design, Visual & Content Design
            </dd>
          </div>

          <div>
            <dt>TOOLS</dt>
            <dd>
             Adobe Photoshop, Adobe Illustrator, Figma, AI Tools
          </div>

          <div>
            <dt>YEAR</dt>
            <dd>2025~2026</dd>
          </div>
        </dl>

        <!-- <a
          class="black-button project-info__button"
          href="https://dy980908.github.io/project01/"
          target="_blank"
          rel="noopener noreferrer"
        >
          VISIT WEBSITE
        </a> -->

      </div>
    </aside>

    <!-- 오른쪽 긴 상세페이지 이미지 -->
    <div class="project-content">
      <img
        class="project-content__image"
        src="../public/images/project04.jpg"
        alt="브랜딩블로그 상세페이지"
      />
    </div>

  </section>

</main>


  <nav class="project-tools" aria-label="프로젝트 페이지 도구">
    <a class="project-tool project-tool--back"
      href="./archive.html" aria-label="프로젝트로 돌아가기"
    >
      <span class="project-tool__icon"
        aria-hidden="true">
        ←
      </span>

      <span class="project-tool__label">
        PROJECT
      </span>
    </a>

    <button
      class="project-tool project-tool--top"
      type="button"
      data-scroll-top
      aria-label="페이지 맨 위로 이동"
    >
      <span
        class="project-tool__icon"
        aria-hidden="true"
      >
        ↑
      </span>

      <span class="project-tool__label">
        TOP
      </span>
    </button>
  </nav>

  <!-- 공용 JS -->
  <script
    type="module"
    src="../js/script.js"></script>
  <script
    type="module"
    src="../js/common.js"></script>


    <script>
document.addEventListener("DOMContentLoaded", () => {
  const topButton = document.querySelector("[data-scroll-top]");

  if (!topButton) return;

  topButton.addEventListener("click", () => {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
});
</script>

<!-- top -->
</body>
</html>
