<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="About NOWB Archive" />
  <title>About — NOWB Archive</title>
  <link rel="stylesheet" href="../css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
    }
  }
  </script>
</head>

<body data-page="about" data-root="../">
  <main>
    <section id="about" class="about">
      <div class="about-viewer-wrap">
        <div id="detail-viewer" class="viewer about-viewer" aria-label="About 3D viewer">
          <div class="drop-overlay">
            <div class="drop-box">
              <strong>UPLOAD 3D MODEL</strong>
              <span>Click or drop a .glb / .gltf file</span>
            </div>
          </div>
          <button class="viewer-action" type="button">Replace ↗</button>
          <div class="viewer-hint">Drag to rotate</div>
          <input class="model-input" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden />
        </div>
      </div>

      <div class="about-content">
        <p class="eyebrow">Selected Object</p>
        <h1 id="about-title" class="about-title"></h1>
        <p id="about-desc" class="about-desc"></p>
        <button class="black-button" type="button">＋ ADD TO COLLECTION</button>
      </div>
    </section>
  </main>

  <script src="../js/common.js"></script>
  <script type="module" src="../js/script.js"></script>
</body>
</html>
