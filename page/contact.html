<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact NOWB Archive" />
  <title>Contact — NOWB Archive</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/contact.css" />

  <!-- 프리텐다드 -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />



</head>

<body data-page="contact" data-root="../">
  <main>

    <section id="contact" class="contact">
      <div class="contact-top">
        <h1 class="contact-title">Get in Touch</h1>

        <p class="contact-copy">
          프로젝트 협업 및 문의는
          <br />아래 연락처로 부탁드립니다. :)<br />
        </p>
      </div>

      <div class="contact-actions">
        <div class="contact-group">
          <a class="contact-link" href="tel:01098085322" data-copy="010-9808-5322">
            Phone
          </a>
        </div>

        <div class="contact-group">
          <a class="contact-link" href="mailto:dy980908@naver.com" data-copy="dy980908@naver.com">
            Email
          </a>
        </div>

      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll(".contact-link").forEach(link => {
      link.addEventListener("click", async function (e) {

        // 모바일에서는 원래대로 동작
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          return;
        }

        // PC에서는 복사
        e.preventDefault();

        const text = this.dataset.copy;

        try {
          await navigator.clipboard.writeText(text);
          showToast("내용이 복사되었습니다!");
        } catch (err) {
          alert("복사에 실패했습니다.");
        }
      });
    });

    function showToast(message) {
      let toast = document.getElementById("copy-toast");

      if (!toast) {
        toast = document.createElement("div");
        toast.id = "copy-toast";
        toast.style.cssText = `

  position: fixed;

  left: 50%;

  top: 50%;

  transform: translate(-50%, -50%);

  background-color: #ffffff17;

backdrop-filter: blur(6px);

  color: #F3B5C9;

  padding: 16px 24px;



    border: 1px solid rgba(255, 255, 255, 0.4);

  font-size: 14px;

  opacity: 0;

  transition: opacity .25s ease;

  z-index: 9999;

  pointer-events: none;

`;
        document.body.appendChild(toast);
      }

      toast.textContent = message;
      toast.style.opacity = "1";

      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => {
        toast.style.opacity = "0";
      }, 1800);
    }
  </script>
  <!-- 주소 복사 -->


  <script src="../js/script.js"></script>
  <script src="../js/common.js"></script>
</body>

</html>
