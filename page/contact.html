<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact NOWB Archive" />
  <title>Contact — NOWB Archive</title>

  <link rel="stylesheet" href="../css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
    }
  }
  </script>
</head>

<body data-page="contact" data-root="../">
  <main>
    <section id="contact" class="contact">
      <div class="contact-top">
        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-copy">
          Interested in collaboration?<br />
          We'd love to hear from you.
        </p>
      </div>

      <div class="contact-actions">
        <div class="contact-group">
          <button id="instagram-link" class="contact-link" type="button">
            Instagram ↗
          </button>

          <button
            class="edit-link"
            type="button"
            data-edit="instagram"
            aria-label="Instagram 링크 수정"
          >
            ✎
          </button>
        </div>

        <div class="contact-group">
          <button id="email-link" class="contact-link" type="button">
            Email ↗
          </button>

          <button
            class="edit-link"
            type="button"
            data-edit="email"
            aria-label="이메일 링크 수정"
          >
            ✎
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/common.js"></script>
  <script type="module" src="../js/script.js"></script>
</body>
</html>
